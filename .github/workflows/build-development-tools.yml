---
name: "Build development-tools base image"

# Build and push the development-tools base image — apt packages, GitHub CLI,
# static binary linters (hadolint, dotenv-linter, sqlcmd, actionlint,
# trufflehog, composite-action-lint, shfmt), and the .NET SDK.
#
# Tags pushed:
#   :latest       what consumers resolve by default
#
# Pushes to GitHub Container Registry (ghcr.io). Auth via the workflow's
# built-in GITHUB_TOKEN — no extra secrets to manage.

on:
  schedule:
    # Daily, and the only cron anywhere in the image chain — every downstream stage rebuilds via
    # its workflow_run trigger from this one tick. Real changes still rebuild immediately via
    # push (paths-filtered), for development-full, repository_dispatch: pre-commit-updated /
    # ai-skills-updated, and for development-credfeto-tools, check-credfeto-tools-updates.yml's
    # own hourly nuget.org poll dispatching a build whenever one of its 5 tracked packages
    # actually releases.
    # Previously each of the 7 stages had its own hourly-or-tighter cron; stacked through the
    # chain that moved development-agent:latest every 15-30 minutes, and the orchestrator host,
    # which pulls before every invocation, lost ~2 hours of a 4.5-hour window purely to podman
    # pull. See #1401.
    - cron: "0 4 * * *"
  push:
    branches: ["main"]
    paths:
      - "containers/base/development-tools/**"
      - ".github/workflows/build-development-tools.yml"
      - ".github/actions/trivy-scan/**"
      - ".github/actions/resolve-shfmt-release/**"
  pull_request:
    # No paths: filter here (unlike push above) — this workflow must always
    # run and report a status on every PR to main, since it is a required
    # status check (see .github/actions/pr-touches-paths). It skips straight
    # to a trivial success when the PR doesn't touch anything relevant.
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: "build-development-tools-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository_owner }}/development-tools"

permissions:
  contents: "read"

jobs:
  # @@required: main
  build-development-tools:
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    permissions:
      contents: "read"
      packages: "write"
      # write: trivy-scan posts its findings as a PR comment (sarif-summary)
      pull-requests: "write"
      security-events: "write"
    steps:
      - name: "Checkout source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: "Check if this image needs rebuilding"
        id: "relevance"
        uses: ./.github/actions/pr-touches-paths
        with:
          github-token: "${{ github.token }}"
          path-prefixes: |
            containers/base/development-tools/
            .github/workflows/build-development-tools.yml
            .github/actions/trivy-scan/
            .github/actions/resolve-shfmt-release/

      # GITHUB_TOKEN is automatically provided by GitHub Actions — no secret
      # configuration required. It has packages:write permission declared above.
      - name: "Log in to GHCR"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ github.token }}"

      - name: "Set up Docker Buildx"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Resolve cache-bust values"
        id: "cb"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "cal_sha=$(git ls-remote https://github.com/bettermarks/composite-action-lint.git HEAD | cut -f1)"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: "Resolve .NET SDK versions"
        id: "dotnet-sdk"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          # Resolved by exact version, not `--channel LTS`/`--channel STS`, so the
          # Dockerfile can install by exact version too: the ARG value itself changing
          # is what busts the SDK-install layer's Docker cache, rather than a separate
          # cache-bust token - no more replaying a stale cached layer forever (#1441).
          # Same releases-index.json source dotnet-version.yml already queries.
          DOTNET_RELEASES_INDEX=$(curl \
            --max-time 120 \
            --retry 5 \
            --retry-delay 0 \
            --retry-max-time 600 \
            -sS \
            -L \
            -f \
            https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/releases-index.json)

          # One jq call resolving everything from the single fetched index. LTS/STS mirror
          # what `dotnet-install.sh --channel LTS`/`--channel STS` actually resolve to (the
          # highest channel-version for that release-type, excluding EOL channels and
          # prerelease/go-live SDKs, whose `latest-sdk` carries a `-rc.`/`-preview.` suffix).
          # The go-live channel/SDK are whichever release currently carries a Microsoft
          # go-live licence (installed alongside LTS/STS so it can be built/tested against
          # before GA, #1443), empty when none is current - there is normally at most one
          # go-live channel at a time.
          DOTNET_SDK_RESOLUTION=$(printf '%s' "$DOTNET_RELEASES_INDEX" | jq -rce '
              (
                ."releases-index"
                | map(select(."support-phase" != "eol" and (."latest-sdk" | test("-") | not)))
              ) as $current
              | ($current | map(select(."release-type" == "lts")) | max_by(."channel-version" | split(".") | map(tonumber)) | ."latest-sdk" // "") as $lts
              | ($current | map(select(."release-type" == "sts")) | max_by(."channel-version" | split(".") | map(tonumber)) | ."latest-sdk" // "") as $sts
              | (
                  [."releases-index"[] | select(."support-phase" == "go-live")]
                  | sort_by(."channel-version" | split(".") | map(tonumber))
                  | last
                ) as $releaseCandidate
              | [$lts, $sts, ($releaseCandidate."channel-version" // ""), ($releaseCandidate."latest-sdk" // "")]
              | .[]
            ')
          # One value per line rather than `@tsv` + `IFS=$'\t' read`: tab is "IFS whitespace" in
          # bash, so a tab-delimited `read` silently collapses a run of adjacent tabs (an empty
          # field, e.g. no currently-active STS release) and shifts every field after it left -
          # `mapfile` has no such word-splitting behaviour and keeps a blank line as an empty
          # element.
          mapfile -t DOTNET_SDK_FIELDS <<< "$DOTNET_SDK_RESOLUTION"
          DOTNET_LTS_VERSION="${DOTNET_SDK_FIELDS[0]}"
          DOTNET_STS_VERSION="${DOTNET_SDK_FIELDS[1]}"
          DOTNET_RELEASE_CANDIDATE_CHANNEL="${DOTNET_SDK_FIELDS[2]}"
          DOTNET_RELEASE_CANDIDATE_VERSION="${DOTNET_SDK_FIELDS[3]}"

          # LTS/STS should never legitimately be empty; fail loudly here rather than letting an
          # empty value flow into the Docker build-args and surface later as a confusing
          # dotnet-install.sh failure.
          if [[ -z "$DOTNET_LTS_VERSION" || -z "$DOTNET_STS_VERSION" ]]; then
            echo "::error::Failed to resolve a current LTS and/or STS .NET SDK version from" \
                 "releases-index.json (lts='${DOTNET_LTS_VERSION}', sts='${DOTNET_STS_VERSION}')"
            exit 1
          fi

          {
            echo "lts_version=${DOTNET_LTS_VERSION}"
            echo "sts_version=${DOTNET_STS_VERSION}"
            echo "release_candidate_channel=${DOTNET_RELEASE_CANDIDATE_CHANNEL}"
            echo "release_candidate_version=${DOTNET_RELEASE_CANDIDATE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Resolved here rather than inside the Dockerfile so the API call is authenticated
      # (unauthenticated calls share the hosted runner's IP rate limit), and so the exact
      # version changing is what busts the shfmt layer's cache.
      - name: "Resolve latest shfmt release"
        id: "shfmt"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/resolve-shfmt-release
        with:
          github-token: "${{ github.token }}"

      - name: "Build and push"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "containers/base/development-tools"
          file: "containers/base/development-tools/Dockerfile"
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          tags: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          build-args: |
            COMPOSITE_ACTION_LINT_CACHE_BUST=${{ steps.cb.outputs.cal_sha }}
            APT_UPGRADE_CACHE_BUST=${{ steps.cb.outputs.date }}
            DOTNET_LTS_VERSION=${{ steps.dotnet-sdk.outputs.lts_version }}
            DOTNET_STS_VERSION=${{ steps.dotnet-sdk.outputs.sts_version }}
            DOTNET_RELEASE_CANDIDATE_CHANNEL=${{ steps.dotnet-sdk.outputs.release_candidate_channel }}
            DOTNET_RELEASE_CANDIDATE_VERSION=${{ steps.dotnet-sdk.outputs.release_candidate_version }}
            SHFMT_VERSION=${{ steps.shfmt.outputs.version }}
            SHFMT_SHA256_AMD64=${{ steps.shfmt.outputs.sha256-amd64 }}
            SHFMT_SHA256_ARM64=${{ steps.shfmt.outputs.sha256-arm64 }}
            BUILD_GIT_SHA=${{ github.sha }}
          cache-from: "type=gha,scope=development-tools"
          cache-to: "type=gha,scope=development-tools,mode=max,ignore-error=true"

      - name: "Scan image for vulnerabilities"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: "Summarise"
        if: ${{ github.event_name != 'pull_request' && steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-tools image pushed"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
            echo ""
            echo "bettermarks/composite-action-lint @ \`${{ steps.cb.outputs.cal_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Summarise (build-only, not pushed)"
        if: ${{ github.event_name == 'pull_request' && steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-tools image built (not pushed — pull_request run)"
            echo ""
            echo "Verified the Dockerfile builds; nothing was pushed to \`${{ env.REGISTRY }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Summarise (installed versions)"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/report-installed-versions
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: "Summarise (skipped — no relevant changes)"
        if: ${{ steps.relevance.outputs.relevant != 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-tools build skipped"
            echo ""
            echo "No changed file touched a watched path — nothing to rebuild."
          } >> "$GITHUB_STEP_SUMMARY"
