---
name: "Build development-tools base image"

# Build and push the development-tools base image — apt packages, GitHub CLI,
# static binary linters (hadolint, dotenv-linter, sqlcmd, actionlint,
# trufflehog, composite-action-lint), and the .NET SDK.
#
# Tags pushed:
#   :latest       what consumers resolve by default
#
# Pushes to GitHub Container Registry (ghcr.io). Auth via the workflow's
# built-in GITHUB_TOKEN — no extra secrets to manage.

on:
  schedule:
    # Daily, and the only cron anywhere in the image chain — every downstream stage rebuilds via
    # its workflow_run trigger from this one tick. Real changes still rebuild immediately via
    # push (paths-filtered) and, for development-full, repository_dispatch: pre-commit-updated.
    # Previously each of the 7 stages had its own hourly-or-tighter cron; stacked through the
    # chain that moved development-agent:latest every 15-30 minutes, and the orchestrator host,
    # which pulls before every invocation, lost ~2 hours of a 4.5-hour window purely to podman
    # pull. See #1401.
    - cron: "0 4 * * *"
  push:
    branches: ["main"]
    paths:
      - "containers/base/development-tools/**"
      - ".github/workflows/build-development-tools.yml"
      - ".github/actions/trivy-scan/**"
  pull_request:
    # No paths: filter here (unlike push above) — this workflow must always
    # run and report a status on every PR to main, since it is a required
    # status check (see .github/actions/pr-touches-paths). It skips straight
    # to a trivial success when the PR doesn't touch anything relevant.
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: "build-development-tools-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository_owner }}/development-tools"

permissions:
  contents: "read"

jobs:
  # @@required: main
  build-development-tools:
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    permissions:
      contents: "read"
      packages: "write"
      pull-requests: "read"
      security-events: "write"
    steps:
      - name: "Checkout source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: "Check if this image needs rebuilding"
        id: "relevance"
        uses: ./.github/actions/pr-touches-paths
        with:
          github-token: "${{ github.token }}"
          path-prefixes: |
            containers/base/development-tools/
            .github/workflows/build-development-tools.yml
            .github/actions/trivy-scan/

      # GITHUB_TOKEN is automatically provided by GitHub Actions — no secret
      # configuration required. It has packages:write permission declared above.
      - name: "Log in to GHCR"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ github.token }}"

      - name: "Set up Docker Buildx"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Resolve cache-bust values"
        id: "cb"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "cal_sha=$(git ls-remote https://github.com/bettermarks/composite-action-lint.git HEAD | cut -f1)"
          } >> "$GITHUB_OUTPUT"

          # dotnet-install.sh --channel LTS/STS in the Dockerfile has no version pin of its
          # own, so the RUN instruction's text never changes - Docker would otherwise replay
          # the cached layer forever and the installed SDK would silently freeze. Hash the
          # current LTS/STS/go-live values (same releases-index.json source dotnet-version.yml
          # already queries) so the layer only rebuilds when a new SDK is actually released.
          # See #1441.
          DOTNET_RELEASES_INDEX=$(curl \
            --max-time 120 \
            --retry 5 \
            --retry-delay 0 \
            --retry-max-time 600 \
            -sS \
            -L \
            -f \
            https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/releases-index.json)

          # One jq call resolving everything from the single fetched index (rather than
          # re-parsing it per field): the LTS/STS join mirrors what `dotnet-install.sh
          # --channel LTS`/`--channel STS` actually resolve to (the highest channel-version
          # per release-type, excluding EOL channels and prerelease/go-live SDKs, whose
          # `latest-sdk` carries a `-rc.`/`-preview.` suffix); the go-live channel/SDK are
          # whichever release currently carries a Microsoft go-live license (installed
          # alongside LTS/STS so it can be built/tested against before GA), empty when none
          # is current - there is normally at most one go-live channel at a time.
          DOTNET_SDK_RESOLUTION=$(printf '%s' "$DOTNET_RELEASES_INDEX" | jq -rce '
              (
                ."releases-index"
                | map(select(."support-phase" != "eol" and (."latest-sdk" | test("-") | not)))
                | group_by(."release-type")
                | map(max_by(."channel-version" | split(".") | map(tonumber)))
                | map(."latest-sdk")
                | sort
                | join(",")
              ) as $lts_sts
              | (
                  [."releases-index"[] | select(."support-phase" == "go-live")]
                  | sort_by(."channel-version" | split(".") | map(tonumber))
                  | last
                ) as $golive
              | [$lts_sts, ($golive."channel-version" // ""), ($golive."latest-sdk" // "")]
              | @tsv
            ')
          IFS=$'\t' read -r DOTNET_LTS_STS_VERSIONS DOTNET_GOLIVE_CHANNEL DOTNET_GOLIVE_SDK <<< "$DOTNET_SDK_RESOLUTION"

          # No need to hash this - the Dockerfile only cares that the value changes when the
          # SDK does (`: "${DOTNET_SDK_CACHE_BUST}"`), and the plain string is more readable
          # in `docker history`/build logs than a digest.
          {
            echo "dotnet_golive_channel=${DOTNET_GOLIVE_CHANNEL}"
            echo "dotnet_sdk_cache_bust=${DOTNET_LTS_STS_VERSIONS}|${DOTNET_GOLIVE_CHANNEL}|${DOTNET_GOLIVE_SDK}"
          } >> "$GITHUB_OUTPUT"

      - name: "Build and push"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "containers/base/development-tools"
          file: "containers/base/development-tools/Dockerfile"
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          tags: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          build-args: |
            COMPOSITE_ACTION_LINT_CACHE_BUST=${{ steps.cb.outputs.cal_sha }}
            DOTNET_SDK_CACHE_BUST=${{ steps.cb.outputs.dotnet_sdk_cache_bust }}
            DOTNET_GOLIVE_CHANNEL=${{ steps.cb.outputs.dotnet_golive_channel }}
            BUILD_GIT_SHA=${{ github.sha }}
          cache-from: "type=gha,scope=development-tools"
          cache-to: "type=gha,scope=development-tools,mode=max,ignore-error=true"

      - name: "Scan image for vulnerabilities"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: "Summarise"
        if: ${{ github.event_name != 'pull_request' && steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-tools image pushed"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
            echo ""
            echo "bettermarks/composite-action-lint @ \`${{ steps.cb.outputs.cal_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Summarise (build-only, not pushed)"
        if: ${{ github.event_name == 'pull_request' && steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-tools image built (not pushed — pull_request run)"
            echo ""
            echo "Verified the Dockerfile builds; nothing was pushed to \`${{ env.REGISTRY }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Summarise (installed versions)"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/report-installed-versions
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: "Summarise (skipped — no relevant changes)"
        if: ${{ steps.relevance.outputs.relevant != 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-tools build skipped"
            echo ""
            echo "No changed file touched a watched path — nothing to rebuild."
          } >> "$GITHUB_STEP_SUMMARY"
