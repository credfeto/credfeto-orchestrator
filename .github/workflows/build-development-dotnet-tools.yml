---
name: "Build development-dotnet-tools base image"

# Build and push the development-dotnet-tools base image — claude-code and the
# stable, third-party (non-credfeto/funfair) .NET global tools — layered on
# top of development-python.
#
# Tags pushed:
#   :latest       what consumers resolve by default
#
# Pushes to GitHub Container Registry (ghcr.io). Auth via the workflow's
# built-in GITHUB_TOKEN — no extra secrets to manage.

on:
  workflow_run:
    workflows: ["Build development-python base image"]
    types:
      - completed
    branches:
      - "main"
  push:
    branches: ["main"]
    paths:
      - "containers/base/development-dotnet-tools/**"
      - ".github/workflows/build-development-dotnet-tools.yml"
      - ".github/actions/nuget-latest-versions/**"
      - ".github/actions/trivy-scan/**"
  pull_request:
    # No paths: filter here (unlike push above) — this workflow must always
    # run and report a status on every PR to main, since it is a required
    # status check (see .github/actions/pr-touches-paths). It skips straight
    # to a trivial success when the PR doesn't touch anything relevant.
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: "build-development-dotnet-tools-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository_owner }}/development-dotnet-tools"

permissions:
  contents: "read"

jobs:
  # @@required: main
  build-development-dotnet-tools:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    permissions:
      contents: "read"
      packages: "write"
      pull-requests: "read"
      security-events: "write"
      actions: "write"
    steps:
      - name: "Checkout source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: "Check if this image needs rebuilding"
        id: "relevance"
        uses: ./.github/actions/pr-touches-paths
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path-prefixes: |
            containers/base/development-dotnet-tools/
            .github/workflows/build-development-dotnet-tools.yml
            .github/actions/nuget-latest-versions/
            .github/actions/trivy-scan/

      # GITHUB_TOKEN is automatically provided by GitHub Actions — no secret
      # configuration required. It has packages:write permission declared above.
      - name: "Log in to GHCR"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Set up Docker Buildx"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "Resolve cache-bust value"
        id: "cb"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/nuget-latest-versions
        with:
          package-ids: |
            TSQLLint
            CWM.RoslynNavigator
            dotnet-ef
            ilspycmd
            Microsoft.SqlPackage
            PowerShell
            dotnet-script
            dotnet-reportgenerator-globaltool

      - name: "Build and push"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "containers/base/development-dotnet-tools"
          file: "containers/base/development-dotnet-tools/Dockerfile"
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          tags: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          build-args: |
            STABLE_TOOLS_CACHE_BUST=${{ steps.cb.outputs.version-hash }}
          cache-from: "type=gha,scope=development-dotnet-tools"
          cache-to: "type=gha,scope=development-dotnet-tools,mode=max,ignore-error=true"

      - name: "Scan image for vulnerabilities"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: "Dispatch development-credfeto-tools build"
        # Only for the workflow_run-chained case: development-credfeto-tools already
        # has its own native workflow_run trigger on this workflow, which fires fine
        # when dotnet-tools itself is a fresh root (direct push or workflow_dispatch),
        # since that puts credfeto-tools at hop 1. Gating on event_name == 'workflow_run'
        # skips the explicit dispatch there, avoiding a redundant second trigger racing
        # the native one (both land in credfeto-tools' concurrency group, so one gets
        # cancelled - harmless but wasted). It doesn't fully distinguish a node/python-root
        # chain (dotnet-tools at hop 1 or 2, native trigger still reaches credfeto-tools)
        # from the tools-root chain (dotnet-tools at hop 3, native trigger blocked)
        # without walking the workflow_run API chain, so the node/python-root case can
        # still double-fire and self-heal the same way; only the common direct-trigger
        # case is fully covered.
        if: ${{ github.event_name == 'workflow_run' && steps.relevance.outputs.relevant == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            // workflow_run chains stop after 3 hops (tools -> node -> python ->
            // dotnet-tools is already 3), so development-credfeto-tools never
            // fires from here via workflow_run alone. A workflow_dispatch call
            // is a fresh root, giving its own downstream chain (full, agent) a
            // full 3-hop budget again. See #1424.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build-development-credfeto-tools.yml",
              ref: "main",
            });

            core.info("✅ Dispatched build-development-credfeto-tools.yml");
            core.notice("Dispatched development-credfeto-tools build");

      - name: "Summarise"
        if: ${{ github.event_name != 'pull_request' && steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-dotnet-tools image pushed"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
            echo ""
            echo "NuGet version hash: \`${{ steps.cb.outputs.version-hash }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Summarise (build-only, not pushed)"
        if: ${{ github.event_name == 'pull_request' && steps.relevance.outputs.relevant == 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-dotnet-tools image built (not pushed — pull_request run)"
            echo ""
            echo "Verified the Dockerfile builds; nothing was pushed to \`${{ env.REGISTRY }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Summarise (installed versions)"
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        uses: ./.github/actions/report-installed-versions
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: "Summarise (skipped — no relevant changes)"
        if: ${{ steps.relevance.outputs.relevant != 'true' }}
        shell: "bash"
        run: |
          {
            echo "## development-dotnet-tools build skipped"
            echo ""
            echo "No changed file touched a watched path — nothing to rebuild."
          } >> "$GITHUB_STEP_SUMMARY"
