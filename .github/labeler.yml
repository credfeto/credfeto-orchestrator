--- # Configures the GitHub Pull Request Labeler - applies labels to pull requests based on changed files.
# Generated by credfeto-dotnet-repo-tools
".NET update":
  - any: ['src/global.json']
"C#":
  - any: ['./**/*.cs', './**/*.csproj']
"C# Project":
  - any: ['./**/*.csproj']
"C# Solution":
  - any: ['./**/*.sln', './**/*.slnx']
"Change Log":
  - any: ['CHANGELOG.md']
"Config Change":
  - any: ['src/**/*.json', '!src/global.json']
"credfeto-orchestrator-cmd":
  - any: ['src/Credfeto.Orchestrator.Cmd/**/*']
"credfeto-orchestrator-commands":
  - any: ['src/Credfeto.Orchestrator.Commands/**/*']
"credfeto-orchestrator-commands-tests":
  - any: ['src/Credfeto.Orchestrator.Commands.Tests/**/*']
"credfeto-orchestrator-config":
  - any: ['src/Credfeto.Orchestrator.Config/**/*']
"credfeto-orchestrator-config-tests":
  - any: ['src/Credfeto.Orchestrator.Config.Tests/**/*']
"credfeto-orchestrator-fingerprints":
  - any: ['src/Credfeto.Orchestrator.Fingerprints/**/*']
"credfeto-orchestrator-fingerprints-tests":
  - any: ['src/Credfeto.Orchestrator.Fingerprints.Tests/**/*']
"credfeto-orchestrator-github":
  - any: ['src/Credfeto.Orchestrator.GitHub/**/*']
"credfeto-orchestrator-github-tests":
  - any: ['src/Credfeto.Orchestrator.GitHub.Tests/**/*']
"credfeto-orchestrator-jq":
  - any: ['src/Credfeto.Orchestrator.Jq/**/*']
"credfeto-orchestrator-jq-tests":
  - any: ['src/Credfeto.Orchestrator.Jq.Tests/**/*']
"dotnet":
  - any: ['src/**/*.csproj']
"Editorconfig":
  - any: ['.editorconfig']
"github-actions":
  - any: ['.github/actions/*.yml', '.github/workflows/*.yml']
"Markdown":
  - any: ['./**/*.md']
"Migration Script":
  - any: ['tools/MigrationScripts/**/*']
"npm":
  - any: ['./**/package-lock.json', './**/package.json']
"Powershell":
  - any: ['./**/*.ps1', './**/*.psm1']
"Read Me":
  - any: ['README.md']
"Setup":
  - any: ['SETUP.md']
"Solidity":
  - any: ['./**/*.sol']
"SQL":
  - any: ['./**/*.sql', 'db/**/*']
"Static Code Analysis Rules":
  - any: ['.globalconfig', 'src/CodeAnalysis.ruleset']
"Unit Tests":
  - any: ['src/*.Tests.*/**/*', 'src/*.Tests.Integration.*/**/*', 'src/*.Tests.Integration/**/*', 'src/*.Tests/**/*']
