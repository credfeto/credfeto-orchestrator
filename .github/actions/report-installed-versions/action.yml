--- # Read back the /opt/installed-versions.txt report baked into a just-built image
name: "Report installed tool versions"
description: "Reads /opt/installed-versions.txt out of a container image and returns it as an output for the job summary"
inputs:
  image-ref:
    description: "Fully-qualified container image reference to inspect (e.g. ghcr.io/owner/image:latest)"
    required: true

outputs:
  versions:
    description: "Markdown report: a Tool/Component | Version table when every line is a clean name/value pair, otherwise a fenced code block of the raw report"
    value: "${{steps.report.outputs.versions}}"

runs:
  using: "composite"
  steps:
    - name: "Read installed-versions report from image"
      id: "report"
      shell: "bash"
      run: |
        IMAGE_REF="${{inputs.image-ref}}"

        # A pull_request run has the image already loaded locally (load: true,
        # push: false) — a push run has it in the registry only. Prefer the
        # local copy so pull_request runs don't fetch the previous push's tag.
        if ! docker image inspect "$IMAGE_REF" >/dev/null 2>&1; then
          docker pull "$IMAGE_REF"
        fi

        # --entrypoint overrides any ENTRYPOINT baked into the image (e.g.
        # development-agent's agent-entrypoint) — without it, "cat ..." is
        # passed as arguments to that entrypoint instead of replacing it, and
        # this silently falls through to the "not found" fallback below.
        VERSIONS=$(docker run --rm --entrypoint cat "$IMAGE_REF" /opt/installed-versions.txt 2>/dev/null || true)
        if [ -z "$VERSIONS" ]; then
          VERSIONS="(no /opt/installed-versions.txt found in this image)"
        fi

        # Render as a "Tool/Component | Version" table when every line is a
        # clean "name: value" pair; otherwise (e.g. development-agent's
        # report, which is prose rather than tool:version pairs) fall back to
        # a fenced code block of the raw report.
        if printf '%s\n' "$VERSIONS" | awk '{ if ($0 != "" && $0 !~ /^[^:]+: .+/) exit 1 }'; then
          VERSIONS=$(printf '%s\n' "$VERSIONS" | awk -F': ' '
            BEGIN { print "| Tool/Component | Version |"; print "| --- | --- |" }
            NF >= 2 {
              name = $1
              value = substr($0, length($1) + 3)
              gsub(/\|/, "\\|", name)
              gsub(/\|/, "\\|", value)
              print "| " name " | " value " |"
            }
          ')
        else
          VERSIONS=$(printf '```\n%s\n```' "$VERSIONS")
        fi

        DELIMITER="VERSIONS_EOF_${GITHUB_RUN_ID}_${GITHUB_JOB}"
        {
          echo "versions<<${DELIMITER}"
          echo "$VERSIONS"
          echo "${DELIMITER}"
        } >> "$GITHUB_OUTPUT"
