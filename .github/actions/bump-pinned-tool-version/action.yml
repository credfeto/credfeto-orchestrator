--- # Check one curl-pinned CLI tool in development-tools/Dockerfile against its latest GitHub release
name: "Bump Pinned Tool Version"
description: "Checks a curl-installed, SHA256-pinned CLI tool (hadolint, dotenv-linter, sqlcmd,
  actionlint, trufflehog, trivy) against its latest GitHub release and rewrites its Dockerfile
  ARG pins in place if newer"

inputs:
  tool:
    description: "Tool key: hadolint, dotenv-linter, sqlcmd, actionlint, trufflehog, or trivy"
    required: true
  github-token:
    description: "GitHub token with public-repo read access, for the releases API lookup"
    required: true
  dockerfile-path:
    description: "Path to the Dockerfile containing the tool's ARG pins"
    required: false
    default: "containers/base/development-tools/Dockerfile"

outputs:
  changed:
    description: "Whether a newer release was found and the Dockerfile was rewritten"
    value: "${{steps.bump.outputs.changed}}"
  old-version:
    description: "Previously pinned version"
    value: "${{steps.bump.outputs.old-version}}"
  new-version:
    description: "Newly pinned version"
    value: "${{steps.bump.outputs.new-version}}"
  dockerfile-path:
    description: "The Dockerfile path actually used (echoes the resolved input, single source of
      truth for callers that need it, e.g. a git-auto-commit file_pattern)"
    value: "${{steps.bump.outputs.dockerfile-path}}"

runs:
  using: composite
  steps:
    - name: "Check latest release and rewrite Dockerfile pins"
      id: bump
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TOOL: "${{inputs.tool}}"
        DOCKERFILE_PATH: "${{inputs.dockerfile-path}}"
      with:
        github-token: "${{inputs.github-token}}"
        script: |
          const fs = require("fs");
          const crypto = require("crypto");

          // One entry per curl-pinned tool in development-tools/Dockerfile. `versionHasVPrefix`
          // records whether that tool's own ARG stores the full release tag (e.g. "v2.14.0") or
          // the bare number (e.g. "1.7.12") - the two conventions already coexist in the
          // Dockerfile today (see its own "Pin CLI versions" comment block), so this mirrors
          // each ARG's existing format rather than normalising it, keeping this bump a pure
          // value substitution with no unrelated reformatting. The three ARG names
          // (<PREFIX>_VERSION / <PREFIX>_SHA256_AMD64 / <PREFIX>_SHA256_ARM64) are derived from
          // the tool key below rather than typed out per entry, since all six follow that
          // convention with no exception (verified against the Dockerfile's own ARG block).
          // `assetName` returns just the release asset's filename for one arch - the download
          // URL itself is always `https://github.com/<repo>/releases/download/<tag>/<name>`,
          // built once below from `repo` and the release's own tag_name, so `repo` is never
          // duplicated inside a URL template the way an inlined URL would.
          const TOOLS = {
            hadolint: {
              repo: "hadolint/hadolint",
              versionHasVPrefix: true,
              archTokens: { amd64: "x86_64", arm64: "arm64" },
              assetName: (_version, arch) => `hadolint-Linux-${arch}`,
            },
            "dotenv-linter": {
              repo: "dotenv-linter/dotenv-linter",
              versionHasVPrefix: true,
              archTokens: { amd64: "x86_64", arm64: "aarch64" },
              assetName: (_version, arch) => `dotenv-linter-linux-${arch}.tar.gz`,
            },
            sqlcmd: {
              repo: "microsoft/go-sqlcmd",
              versionHasVPrefix: true,
              archTokens: { amd64: "amd64", arm64: "arm64" },
              assetName: (_version, arch) => `sqlcmd-linux-${arch}.tar.bz2`,
            },
            actionlint: {
              repo: "rhysd/actionlint",
              versionHasVPrefix: false,
              archTokens: { amd64: "amd64", arm64: "arm64" },
              assetName: (version, arch) => `actionlint_${version}_linux_${arch}.tar.gz`,
            },
            trufflehog: {
              repo: "trufflesecurity/trufflehog",
              versionHasVPrefix: false,
              archTokens: { amd64: "amd64", arm64: "arm64" },
              assetName: (version, arch) => `trufflehog_${version}_linux_${arch}.tar.gz`,
            },
            trivy: {
              repo: "aquasecurity/trivy",
              versionHasVPrefix: false,
              archTokens: { amd64: "64bit", arm64: "ARM64" },
              assetName: (version, arch) => `trivy_${version}_Linux-${arch}.tar.gz`,
            },
          };

          const toolKey = process.env.TOOL;
          const tool = TOOLS[toolKey];
          if (!tool) {
            core.setFailed(`❌ Unknown tool "${toolKey}" - must be one of: ${Object.keys(TOOLS).join(", ")}`);
            return;
          }

          const dockerfilePath = process.env.DOCKERFILE_PATH;
          core.setOutput("dockerfile-path", dockerfilePath);
          const dockerfile = fs.readFileSync(dockerfilePath, "utf8");

          // <PREFIX>_VERSION / <PREFIX>_SHA256_AMD64 / <PREFIX>_SHA256_ARM64 - derived, not
          // stored per tool, since the Dockerfile's own ARG names follow this uniformly.
          const prefix = toolKey.toUpperCase().replace(/-/g, "_");
          const versionArg = `${prefix}_VERSION`;
          const shaArgs = { amd64: `${prefix}_SHA256_AMD64`, arm64: `${prefix}_SHA256_ARM64` };
          // Single source of truth for the "ARG <name>=<value>" line grammar, read and write
          // sides alike - a write-side mismatch would otherwise be a silent String.replace()
          // no-op (a SHA256 ARG left stale while the version ARG bumps), not a thrown error.
          const argLineRe = (name) => new RegExp(`^ARG ${name}=(\\S+)$`, "m");

          const currentMatch = dockerfile.match(argLineRe(versionArg));
          if (!currentMatch) {
            core.setFailed(`❌ Could not find "ARG ${versionArg}=" in ${dockerfilePath}`);
            return;
          }
          const currentVersion = currentMatch[1];

          const [owner, repo] = tool.repo.split("/");
          const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo });
          const newVersion = tool.versionHasVPrefix ? release.tag_name : release.tag_name.replace(/^v/, "");

          core.info(`ℹ️ ${toolKey}: pinned ${currentVersion}, latest release ${newVersion}`);

          // Plain numeric semver compare, not just !==: all six tools publish bare X.Y[.Z] tags
          // (verified against each one's actual release history), so this never needs to handle
          // pre-release suffixes. A <= 0 comparison (not just ===) also guards the case
          // getLatestRelease ever returns something that isn't actually newer - e.g. a point
          // release published on an older line after the currently-pinned tag - so this can
          // never silently downgrade the pin (mirrors dotnet-version.yml's own sort -V guard for
          // the same class of workflow).
          function compareVersions(a, b) {
            const partsA = a.replace(/^v/, "").split(".").map(Number);
            const partsB = b.replace(/^v/, "").split(".").map(Number);
            for (let i = 0; i < Math.max(partsA.length, partsB.length); i += 1) {
              const diff = (partsA[i] || 0) - (partsB[i] || 0);
              if (diff !== 0) {
                return diff;
              }
            }
            return 0;
          }

          if (compareVersions(newVersion, currentVersion) <= 0) {
            core.info(`✅ ${toolKey} is already on the latest release (${currentVersion})`);
            core.setOutput("changed", "false");
            return;
          }

          // Download the exact same file each tool's own Dockerfile RUN step downloads (the raw
          // binary for hadolint, the archive itself for the rest - the Dockerfile checksums
          // whichever one it fetches), for both architectures, and hash it. No extraction and no
          // execution of the downloaded content: the existing build pipeline's own sanity checks
          // (each Dockerfile RUN step ends by running the installed tool) validate that a newly
          // pinned release actually works, once this PR's branch is built.
          async function sha256OfAsset(arch) {
            const name = tool.assetName(newVersion, tool.archTokens[arch]);
            const url = `https://github.com/${tool.repo}/releases/download/${release.tag_name}/${name}`;
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`download failed for ${toolKey} ${arch}: HTTP ${response.status} from ${url}`);
            }
            const buffer = Buffer.from(await response.arrayBuffer());
            return crypto.createHash("sha256").update(buffer).digest("hex");
          }

          const [shaAmd64, shaArm64] = await Promise.all([sha256OfAsset("amd64"), sha256OfAsset("arm64")]);

          const replacements = [
            [versionArg, newVersion],
            [shaArgs.amd64, shaAmd64],
            [shaArgs.arm64, shaArm64],
          ];
          let updated = dockerfile;
          for (const [name, value] of replacements) {
            const re = argLineRe(name);
            if (!re.test(updated)) {
              core.setFailed(`❌ Could not find "ARG ${name}=" in ${dockerfilePath} while rewriting - refusing to leave a stale ARG`);
              return;
            }
            updated = updated.replace(re, `ARG ${name}=${value}`);
          }
          fs.writeFileSync(dockerfilePath, updated);

          core.info(`✅ Bumped ${toolKey}: ${currentVersion} -> ${newVersion}`);
          core.notice(`${toolKey}: ${currentVersion} -> ${newVersion}`);
          core.setOutput("changed", "true");
          core.setOutput("old-version", currentVersion);
          core.setOutput("new-version", newVersion);
