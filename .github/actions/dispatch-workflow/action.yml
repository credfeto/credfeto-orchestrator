--- # Explicitly dispatch another workflow in this repo via workflow_dispatch.
# A workflow_dispatch call is a fresh trigger root, so this resets the
# workflow_run chain-depth budget for anything downstream of the dispatched
# workflow (GitHub does not chain workflow_run more than 3 hops from the
# triggering event). Used where a chain of workflow_run-linked image builds
# has grown past that budget. See #1424.
#
# `github-token` MUST be a PAT (e.g. secrets.SOURCE_PUSH_TOKEN), never the
# default GITHUB_TOKEN: GitHub exempts events triggered by GITHUB_TOKEN from
# triggering further workflow runs (a recursion guard), so a workflow_dispatch
# made with GITHUB_TOKEN creates the dispatched run fine, but that run's own
# completion can never cascade to any downstream workflow_run listener -
# silently defeating the whole point of this action. See #1444.
name: "Dispatch workflow"
description: "Dispatches another workflow in this repository via workflow_dispatch"

inputs:
  workflow-id:
    description: "Filename of the workflow to dispatch (e.g. build-development-credfeto-tools.yml)"
    required: true
  ref:
    description: "Git ref to run the dispatched workflow on"
    required: false
    default: "main"
  github-token:
    description: "A PAT with actions:write (e.g. secrets.SOURCE_PUSH_TOKEN) - NOT github.token, whose dispatched runs can't cascade further. See #1444."
    required: true

runs:
  using: "composite"
  steps:
    - name: "Dispatch"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKFLOW_ID: "${{inputs.workflow-id}}"
        DISPATCH_REF: "${{inputs.ref}}"
      with:
        github-token: "${{inputs.github-token}}"
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: process.env.WORKFLOW_ID,
            ref: process.env.DISPATCH_REF,
          });

          core.info(`✅ Dispatched ${process.env.WORKFLOW_ID}`);
          core.notice(`Dispatched ${process.env.WORKFLOW_ID}`);
