--- # Resolve the latest mvdan/sh (shfmt) release and the GitHub-computed digests of its Linux binaries
name: "Resolve latest shfmt release"
description: "Resolves the latest non-prerelease mvdan/sh release and the SHA256 digests GitHub recorded on upload for its linux amd64 and arm64 shfmt binaries"
inputs:
  github-token:
    description: "GitHub token used for the releases API call (avoids the shared-IP unauthenticated rate limit)"
    required: true

outputs:
  version:
    description: "Release tag, e.g. v3.14.1"
    value: "${{steps.resolve.outputs.version}}"
  sha256-amd64:
    description: "Hex SHA256 of shfmt_<version>_linux_amd64"
    value: "${{steps.resolve.outputs.sha256-amd64}}"
  sha256-arm64:
    description: "Hex SHA256 of shfmt_<version>_linux_arm64"
    value: "${{steps.resolve.outputs.sha256-arm64}}"

runs:
  using: "composite"
  steps:
    - name: "Resolve latest shfmt release"
      id: "resolve"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: "${{inputs.github-token}}"
        script: |
          const { data: release } = await github.rest.repos.getLatestRelease({
            owner: "mvdan",
            repo: "sh",
          });

          const version = release.tag_name;
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
            throw new Error("❌ mvdan/sh latest release tag '" + version + "' is not a vX.Y.Z version");
          }

          // Assets uploaded before GitHub started computing digests report null, so a
          // missing or malformed digest must fail rather than skip verification.
          const digestFor = (arch) => {
            const name = "shfmt_" + version + "_linux_" + arch;
            const asset = release.assets.find((a) => a.name === name);
            const match = /^sha256:([0-9a-f]{64})$/.exec(asset?.digest ?? "");
            if (!match) {
              throw new Error("❌ " + name + " is missing from mvdan/sh " + version + " or has no sha256 digest (got '" + (asset?.digest ?? "no asset") + "')");
            }
            return match[1];
          };

          const sha256Amd64 = digestFor("amd64");
          const sha256Arm64 = digestFor("arm64");

          core.info("shfmt version: \u001b[38;5;6m" + version);
          core.notice("shfmt version: " + version);
          core.setOutput("version", version);
          core.setOutput("sha256-amd64", sha256Amd64);
          core.setOutput("sha256-arm64", sha256Arm64);
